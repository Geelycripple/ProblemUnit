<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Problem Geely</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a252f; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
    input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; background: #fafafa; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; }
    button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #95a5a6; }
    .row-2 { display: flex; gap: 10px; }
    .row-2 > div { flex: 1; }
  </style>
</head>
<body>

<div class="card">
  <h2>Unit Problem Geely 吉利车辆问题</h2>
  
  <form id="problemForm">
    <!-- Date & Time -->
    <div class="row-2">
      <div class="form-group">
        <label>Date 日期*</label>
        <input type="text" id="dateInput" readonly>
      </div>
      <div class="form-group">
        <label>Time 时间*</label>
        <input type="text" id="timeInput" readonly>
      </div>
    </div>

    <!-- VIN & Scan Barcode -->
    <div class="form-group">
      <label>VIN NO 车架号*</label>
      <button type="button" id="scanBtn" style="background-color: #00a86b; margin-bottom: 8px;">📷 Live Scan Barcode</button>
      <input type="text" id="vinInput" placeholder="Hasil Scan VIN..." required>
    </div>

    <!-- Car Model & Colour -->
    <div class="form-group">
      <label>Car Model 车型</label>
      <input type="text" id="carModelInput" placeholder="Terisi otomatis..." readonly>
    </div>
    <div class="form-group">
      <label>Colour 颜色</label>
      <input type="text" id="colourInput" placeholder="Terisi otomatis..." readonly>
    </div>

    <!-- 1. Station -->
    <div class="form-group">
      <label>Station 工位*</label>
      <select id="stationSelect" required>
        <option value="">Pilih Station / 请选择</option>
        <option value="IN TESTLINE">IN TESTLINE</option>
        <option value="INSPECTION">INSPECTION</option>
        <option value="AFTER INSPECTION">AFTER INSPECTION</option>
        <option value="SIGN OFF">SIGN OFF</option>
      </select>
    </div>

    <!-- 2. Problem Inspection (Multi Select) -->
    <div class="form-group">
      <label>Problem Inspection 检验问题*</label>
      <div class="checkbox-group" id="problemInspectionGroup">
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Gap"> Gap</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Rash"> Rash</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Flush"> Flush</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Wavy"> Wavy</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Bending"> Bending</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Dent Issue"> Dent Issue</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Crater"> Crater</label>
        <label class="checkbox-item" style="color: green; font-weight: bold;"><input type="checkbox" name="probInsp" value="PROBLEM DONE"> ✅ PROBLEM DONE</label>
      </div>
    </div>

    <!-- 3. Problem Description Inspection -->
    <div class="form-group">
      <label>Problem Description Inspection 检验问题详细描述</label>
      <textarea id="descInspInput" rows="2" placeholder="Masukkan rincian problem inspection..."></textarea>
    </div>

    <!-- 4. Problem After Inspection (Multi Select) -->
    <div class="form-group">
      <label>Problem After Inspection 检验后问题*</label>
      <div class="checkbox-group" id="problemAfterGroup">
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Noise"> Noise</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="ADAS"> ADAS</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Electrical"> Electrical</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Mechanichal"> Mechanichal</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Change Part"> Change Part</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Liquidity"> Liquidity</label>
        <label class="checkbox-item" style="color: green; font-weight: bold;"><input type="checkbox" name="probAfter" value="PROBLEM DONE"> ✅ PROBLEM DONE</label>
      </div>
    </div>

    <!-- 5. Problem Description After Inspection -->
    <div class="form-group">
      <label>Problem Description After Inspection 检验后问题详细描述</label>
      <textarea id="descAfterInput" rows="2" placeholder="Masukkan rincian problem after inspection..."></textarea>
    </div>

    <button type="submit" id="submitBtn">SUBMIT / 提交</button>
  </form>
</div>

<script>
  // ** GANTI DENGAN URL APPS SCRIPT ANDA **
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyo6rfoyg1NvkPTIpIUv1r0dDf6Q7UhUo9VenHvPbz2luhEriZmmBWADZyRwxh5xABJKA/exec";

  // Auto Set Date & Time
  function updateDateTime() {
    const now = new Date();
    document.getElementById('dateInput').value = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    document.getElementById('timeInput').value = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  // Auto Search VIN
  document.getElementById('vinInput').addEventListener('change', function() {
    const vin = this.value.trim();
    if (!vin) return;

    document.getElementById('carModelInput').value = "Mencari...";
    document.getElementById('colourInput').value = "Mencari...";

    const cbName = 'jsonp_search_' + Math.round(100000 * Math.random());
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=searchVIN&vin=${encodeURIComponent(vin)}&callback=${cbName}&authuser=0`;

    window[cbName] = function(data) {
      delete window[cbName];
      document.body.removeChild(script);
      if (data.status === 'success') {
        document.getElementById('carModelInput').value = data.carModel || '';
        document.getElementById('colourInput').value = data.colour || '';
      } else {
        alert("VIN tidak ditemukan di Master Data!");
        document.getElementById('carModelInput').value = '';
        document.getElementById('colourInput').value = '';
      }
    };
    document.body.appendChild(script);
  });

  // Submit Form
  document.getElementById('problemForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Mengirim...";

    // Ambil checkbox Problem Inspection
    const probInsp = Array.from(document.querySelectorAll('input[name="probInsp"]:checked')).map(c => c.value).join(', ');
    
    // Ambil checkbox Problem After Inspection
    const probAfter = Array.from(document.querySelectorAll('input[name="probAfter"]:checked')).map(c => c.value).join(', ');

    const payload = {
      action: 'saveData',
      timeInput: document.getElementById('dateInput').value + " " + document.getElementById('timeInput').value,
      vin: document.getElementById('vinInput').value.trim(),
      carModel: document.getElementById('carModelInput').value,
      colour: document.getElementById('colourInput').value,
      station: document.getElementById('stationSelect').value,
      problemInspection: probInsp,
      descInspection: document.getElementById('descInspInput').value,
      problemAfter: probAfter,
      descAfter: document.getElementById('descAfterInput').value
    };

    const cbName = 'jsonp_save_' + Math.round(100000 * Math.random());
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=saveData&data=${encodeURIComponent(JSON.stringify(payload))}&callback=${cbName}&authuser=0`;

    window[cbName] = function(res) {
      delete window[cbName];
      document.body.removeChild(script);
      submitBtn.disabled = false;
      submitBtn.innerText = "SUBMIT / 提交";

      if (res.status === 'success') {
        alert(res.message);
        document.getElementById('problemForm').reset();
        updateDateTime();
      } else {
        alert("Gagal: " + res.message);
      }
    };

    script.onerror = function() {
      delete window[cbName];
      document.body.removeChild(script);
      submitBtn.disabled = false;
      submitBtn.innerText = "SUBMIT / 提交";
      alert("Error jaringan atau URL Apps Script belum valid.");
    };

    document.body.appendChild(script);
  });
</script>
</body>
</html>
