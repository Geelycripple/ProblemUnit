<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unit Problem Geely</title>

  <!-- Library Scan Barcode/QR yang Paling Stabil untuk Mobile/iOS -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- JS-SDK WeCom -->
  <script src="https://res.wx.qq.com/open/js/jweixin-1.2.0.js"></script>

  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --input-bg: #ffffff;
      --input-readonly: #e2e8f0;
      --input-border: #cbd5e1;
      --input-focus: #2563eb;
      --text-main: #0f172a;
      --text-label: #334155;
      --text-muted: #64748b;
      --btn-green: #10b981;
      --btn-purple: #8b5cf6;
      --btn-blue: #2563eb;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 12px 32px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .form-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .form-header {
      margin-bottom: 24px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .form-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-label);
      margin-bottom: 6px;
    }

    label span.cn {
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 4px;
    }

    label span.req {
      color: #ef4444;
      margin-left: 2px;
    }

    input[type="text"], 
    textarea {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    input[readonly] {
      background-color: var(--input-readonly) !important;
      color: #475569 !important;
      cursor: not-allowed;
      border-color: #cbd5e1;
    }

    input:focus, textarea:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
    }

    .btn-green { background-color: var(--btn-green); }
    .btn-purple { background-color: var(--btn-purple); }

    .btn-submit {
      width: 100%;
      background-color: var(--btn-blue);
      color: #ffffff;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius);
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .scroll-select-box {
      max-height: 140px;
      overflow-y: auto;
      background-color: #f8fafc;
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scroll-option {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background-color: #ffffff;
      border: 1px solid #f1f5f9;
      cursor: pointer;
      user-select: none;
    }

    .scroll-option input[type="checkbox"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--btn-blue);
    }

    .scroll-option span {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
    }

    /* Container Scanner */
    #reader {
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
      border: 2px solid var(--btn-blue);
    }

    .hint-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="form-container">
  <div class="form-header">
    <h2>Unit Problem Geely <span style="font-size: 0.95rem; color: #64748b; font-weight: normal;">吉利车辆问题</span></h2>
  </div>

  <!-- Date & Time Row -->
  <div class="form-group form-group-row">
    <div>
      <label>Date <span class="cn">日期</span><span class="req">*</span></label>
      <input type="text" id="dateInput" readonly>
    </div>
    <div>
      <label>Time <span class="cn">时间</span><span class="req">*</span></label>
      <input type="text" id="timeInput" readonly>
    </div>
  </div>

  <!-- VIN Section -->
  <div class="form-group">
    <label>VIN NO <span class="cn">车架号</span><span class="req">*</span></label>
    <div class="btn-grid">
      <button type="button" class="btn btn-green" onclick="toggleLiveScan()">📷 Live Scan</button>
      <button type="button" class="btn btn-purple" onclick="document.getElementById('file-input').click()">📁 Foto Barcode</button>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none">
    
    <!-- Video Scanner Region -->
    <div id="reader"></div>

    <input type="text" id="vinInput" placeholder="Hasil Scan VIN akan muncul di sini..." readonly required>
    <div class="hint-text">*Nomor VIN terisi otomatis melalui Live Scan atau Foto Barcode.</div>
  </div>

  <!-- Car Model -->
  <div class="form-group">
    <label>Car Model <span class="cn">车型</span></label>
    <input type="text" id="carModel" placeholder="Masukkan Car Model">
  </div>

  <!-- Colour -->
  <div class="form-group">
    <label>Colour <span class="cn">颜色</span></label>
    <input type="text" id="colour" placeholder="Masukkan Warna Vehicle">
  </div>

  <!-- Multi-Select Problem (Scroll Box) -->
  <div class="form-group">
    <label>Problem <span class="cn">问题类别</span><span class="req">*</span></label>
    <div class="scroll-select-box">
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Electrical">
        <span>Electrical 电气问题</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Dent Issue">
        <span>Dent Issue 凹陷/外观</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Repair">
        <span>Repair 维修</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Cripple">
        <span>Cripple 瘫痪/残损</span>
      </label>
    </div>
  </div>

  <!-- Problem Description -->
  <div class="form-group">
    <label>Problem Description <span class="cn">问题详细描述</span></label>
    <textarea id="problemDescription" rows="3" placeholder="Describe the issue in detail... 请详细描述问题"></textarea>
  </div>

  <!-- Submit Button -->
  <button type="button" class="btn btn-submit" id="submitBtn" onclick="submitForm()">Submit Data 提交</button>
</div>

<script>
  const SCRIPT_URL = "URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA";

  let html5QrCode = null;
  let isScanning = false;

  window.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('dateInput').value = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    document.getElementById('timeInput').value = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });

    // Inisialisasi Scanner Engine
    html5QrCode = new Html5Qrcode("reader");
  });

  // Toggle Kamera Live Scan
  function toggleLiveScan() {
    if (isScanning) {
      stopScanner();
    } else {
      startScanner();
    }
  }

  function startScanner() {
    const readerElement = document.getElementById('reader');
    readerElement.style.display = 'block';

    const config = {
      fps: 15,
      qrbox: { width: 280, height: 120 }, // Area scan persegi panjang khusus Barcode 1D / VIN
      aspectRatio: 1.0,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    };

    html5QrCode.start(
      { facingMode: "environment" }, // Paksa Kamera Belakang HP
      config,
      (decodedText) => {
        document.getElementById('vinInput').value = decodedText;
        stopScanner();
      },
      (errorMessage) => {
        // Logging error ringan jika barcode belum pas di area scan
      }
    ).then(() => {
      isScanning = true;
    }).catch(err => {
      alert("Izin kamera ditolak atau tidak didukung oleh browser ini: " + err);
      readerElement.style.display = 'none';
      isScanning = false;
    });
  }

  function stopScanner() {
    if (html5QrCode && isScanning) {
      html5QrCode.stop().then(() => {
        document.getElementById('reader').style.display = 'none';
        isScanning = false;
      }).catch(err => console.error("Gagal menghentikan scanner: ", err));
    }
  }

  // Handle Scan dari Upload Foto Galeri
  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files.length === 0) return;

    const imageFile = e.target.files[0];

    html5QrCode.scanFile(imageFile, true)
      .then(decodedText => {
        document.getElementById('vinInput').value = decodedText;
      })
      .catch(err => {
        alert("Barcode tidak terbaca! Pastikan foto barcode terlihat jelas, tidak buram, dan tegak lurus.");
      });
  });

  function submitForm() {
    const vin = document.getElementById("vinInput").value;
    const carModel = document.getElementById("carModel").value;
    const colour = document.getElementById("colour").value;
    const problemDescription = document.getElementById("problemDescription").value;

    const selectedProblems = [];
    document.querySelectorAll('input[name="problem"]:checked').forEach((cb) => {
      selectedProblems.push(cb.value);
    });

    if (!vin) {
      alert("Harap scan atau upload foto barcode VIN terlebih dahulu!");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.innerText = "Submitting... 提交中";
    btn.disabled = true;

    const payload = {
      vin: vin,
      carModel: carModel,
      colour: colour,
      problem: selectedProblems,
      problemDescription: problemDescription
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(response => {
      alert("Data berhasil tersimpan di Google Sheet!");
      document.getElementById("vinInput").value = "";
      document.getElementById("carModel").value = "";
      document.getElementById("colour").value = "";
      document.getElementById("problemDescription").value = "";
      document.querySelectorAll('input[name="problem"]').forEach(cb => cb.checked = false);
    })
    .catch(error => {
      alert("Gagal mengirim data. Cek koneksi atau URL Apps Script Anda.");
      console.error(error);
    })
    .finally(() => {
      btn.innerText = "Submit Data 提交";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
