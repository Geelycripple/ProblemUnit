<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unit Problem Geely</title>

  <!-- Engine Quagga2 Khusus Barcode 1D / VIN Kertas -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --input-bg: #ffffff;
      --input-readonly: #e2e8f0;
      --input-border: #cbd5e1;
      --input-focus: #2563eb;
      --text-main: #0f172a;
      --text-label: #334155;
      --text-muted: #64748b;
      --btn-green: #10b981;
      --btn-blue: #2563eb;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 12px 32px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .form-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .form-header {
      margin-bottom: 24px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .form-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-label);
      margin-bottom: 6px;
    }

    label span.cn {
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 4px;
    }

    label span.req {
      color: #ef4444;
      margin-left: 2px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    /* Style Readonly Abu-abu Ter-lock */
    input[readonly] {
      background-color: var(--input-readonly) !important;
      color: #475569 !important;
      cursor: not-allowed;
      border-color: #cbd5e1;
    }

    input:focus, textarea:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .btn-green { background-color: var(--btn-green); }

    .btn-submit {
      background-color: var(--btn-blue);
      color: #ffffff;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius);
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .scroll-select-box {
      max-height: 140px;
      overflow-y: auto;
      background-color: #f8fafc;
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scroll-option {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background-color: #ffffff;
      border: 1px solid #f1f5f9;
      cursor: pointer;
      user-select: none;
    }

    .scroll-option input[type="checkbox"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--btn-blue);
    }

    .scroll-option span {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
    }

    /* Kotak Kamera Luas dan Penuh tanpa Batas Pemotongan */
    #interactive.viewport {
      position: relative;
      width: 100%;
      height: 280px;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
      border: 2px solid var(--btn-blue);
      background-color: #000;
    }

    #interactive.viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-line {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      z-index: 10;
      pointer-events: none;
    }

    .hint-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="form-container">
  <div class="form-header">
    <h2>Unit Problem Geely <span style="font-size: 0.95rem; color: #64748b; font-weight: normal;">吉利车辆问题</span></h2>
  </div>

  <div class="form-group form-group-row">
    <div>
      <label>Date <span class="cn">日期</span><span class="req">*</span></label>
      <input type="text" id="dateInput" readonly>
    </div>
    <div>
      <label>Time <span class="cn">时间</span><span class="req">*</span></label>
      <input type="text" id="timeInput" readonly>
    </div>
  </div>

  <!-- VIN Section -->
  <div class="form-group">
    <label>VIN NO <span class="cn">车架号</span><span class="req">*</span></label>
    <button type="button" class="btn btn-green" id="btnLiveScan">📷 Live Scan Barcode</button>
    
    <div id="interactive" class="viewport">
      <div class="scan-line"></div>
    </div>

    <input type="text" id="vinInput" placeholder="Hasil Scan VIN akan muncul di sini..." readonly required>
    <div class="hint-text">*Arahkan garis merah horizontal tepat di tengah-tengah barcode PT HANDAL INDONESIA MOTOR.</div>
  </div>

  <!-- Car Model -->
  <div class="form-group">
    <label>Car Model <span class="cn">车型</span></label>
    <input type="text" id="carModel" placeholder="Terisi otomatis..." readonly>
  </div>

  <!-- Colour -->
  <div class="form-group">
    <label>Colour <span class="cn">颜色</span></label>
    <input type="text" id="colour" placeholder="Terisi otomatis..." readonly>
  </div>

  <!-- Multi-Select Problem -->
  <div class="form-group">
    <label>Problem <span class="cn">问题类别</span><span class="req">*</span></label>
    <div class="scroll-select-box">
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Electrical">
        <span>Electrical 电气问题</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Dent Issue">
        <span>Dent Issue 凹陷/外观</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Repair">
        <span>Repair 维修</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Cripple">
        <span>Cripple 瘫痪/残损</span>
      </label>
    </div>
  </div>

  <!-- Problem Description -->
  <div class="form-group">
    <label>Problem Description <span class="cn">问题详细描述</span></label>
    <textarea id="problemDescription" rows="3" placeholder="Describe the issue in detail... 请详细描述问题"></textarea>
  </div>

  <button type="button" class="btn btn-submit" id="submitBtn">Submit Data 提交</button>
</div>

<script>
  // PASTAISKAN MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBC_f2pV7TgiRCO4NaLiZh72A3nh00mZGOoASLfmAl9qrM699qgaWeiQC3N6jqv17hYw/exec"; 
  let isScanning = false;

  document.addEventListener("DOMContentLoaded", function() {
    updateDateTime();
    document.getElementById("btnLiveScan").addEventListener("click", toggleScanner);
    document.getElementById("submitBtn").addEventListener("click", submitForm);
  });

  function updateDateTime() {
    const now = new Date();
    document.getElementById('dateInput').value = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    document.getElementById('timeInput').value = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
  }

  // Auto Lookup ke Google Sheets
  function fetchVinDetails(vin) {
    document.getElementById('vinInput').value = vin;
    const modelInput = document.getElementById('carModel');
    const colourInput = document.getElementById('colour');

    modelInput.value = "Mencari...";
    colourInput.value = "Mencari...";

    if (!SCRIPT_URL || SCRIPT_URL.includes("URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA")) {
      alert("URL Web App Google Apps Script belum dipasang!");
      modelInput.value = "-";
      colourInput.value = "-";
      return;
    }

    fetchViaJSONP(vin);
  }

  function fetchViaJSONP(vin) {
    const modelInput = document.getElementById('carModel');
    const colourInput = document.getElementById('colour');

    const callbackName = 'handleVin_' + Math.random().toString(36).substring(2, 9);

    window[callbackName] = function(data) {
      if (data && data.status === "success") {
        modelInput.value = data.carModel || "-";
        colourInput.value = data.colour || "-";
      } else {
        modelInput.value = "Tidak Ditemukan";
        colourInput.value = "Tidak Ditemukan";
        alert("VIN: " + vin + " tidak terdaftar di MASTER DATA.");
      }
      delete window[callbackName];
      const elem = document.getElementById(callbackName);
      if (elem) elem.remove();
    };

    const script = document.createElement('script');
    script.id = callbackName;
    script.src = `${SCRIPT_URL}?vin=${encodeURIComponent(vin)}&callback=${callbackName}`;
    script.onerror = function() {
      modelInput.value = "Gagal Akses";
      colourInput.value = "Gagal Akses";
      alert("Gagal terhubung ke Google Sheets.");
      delete window[callbackName];
      script.remove();
    };
    document.body.appendChild(script);
  }

  // Kamera Live Scan Ringan & Lancar
  function toggleScanner() {
    if (isScanning) {
      stopScanner();
    } else {
      startScanner();
    }
  }

  function startScanner() {
    const viewport = document.getElementById('interactive');
    viewport.style.display = 'block';

    if (typeof Quagga === "undefined") {
      alert("Library Scanner belum siap. Cek koneksi internet Anda.");
      return;
    }

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: viewport,
        constraints: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "environment"
        },
      },
      locator: { 
        patchSize: "large", // Dibuat large agar barcode panjang seperti PT Handal mudah tertangkap
        halfSample: true    // Mempercepat kinerja dan menghilangkan lag
      },
      numOfWorkers: 1,      // Mengurangi beban CPU HP agar tidak patah-patah/lag
      decoder: { 
        readers: ["code_128_reader", "code_39_reader"] 
      },
      locate: true
    }, function(err) {
      if (err) {
        alert("Akses kamera gagal: " + err);
        viewport.style.display = 'none';
        return;
      }
      Quagga.start();
      isScanning = true;
    });

    Quagga.onDetected(onBarcodeDetected);
  }

  function onBarcodeDetected(result) {
    if (result && result.codeResult && result.codeResult.code) {
      const code = result.codeResult.code;
      // Memastikan pembacaan VIN valid (minimal 10 karakter)
      if (code.length >= 10) {
        stopScanner();
        fetchVinDetails(code);
      }
    }
  }

  function stopScanner() {
    if (isScanning) {
      Quagga.stop();
      Quagga.offDetected(onBarcodeDetected);
      document.getElementById('interactive').style.display = 'none';
      isScanning = false;
    }
  }

  // Submit Form Data
  function submitForm() {
    const vin = document.getElementById("vinInput").value;
    const carModel = document.getElementById("carModel").value;
    const colour = document.getElementById("colour").value;
    const problemDescription = document.getElementById("problemDescription").value;

    const selectedProblems = [];
    document.querySelectorAll('input[name="problem"]:checked').forEach((cb) => {
      selectedProblems.push(cb.value);
    });

    if (!vin) {
      alert("Harap scan barcode VIN terlebih dahulu!");
      return;
    }

    if (selectedProblems.length === 0) {
      alert("Harap pilih minimal 1 jenis Problem!");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.innerText = "Submitting... 提交中";
    btn.disabled = true;

    const payload = {
      vin: vin,
      carModel: carModel,
      colour: colour,
      problem: selectedProblems,
      problemDescription: problemDescription
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert("Data berhasil terkirim!");
      document.getElementById("vinInput").value = "";
      document.getElementById("carModel").value = "";
      document.getElementById("colour").value = "";
      document.getElementById("problemDescription").value = "";
      document.querySelectorAll('input[name="problem"]').forEach(cb => cb.checked = false);
    })
    .catch(error => {
      alert("Gagal mengirim data.");
      console.error(error);
    })
    .finally(() => {
      btn.innerText = "Submit Data 提交";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
