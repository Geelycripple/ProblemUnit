<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspection & Sign Off Form</title>
  <!-- HTML5 QR / Barcode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      margin: 0;
    }
    .form-container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
      font-size: 1.4rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #ccc;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-green { background-color: #00a86b; }
    .btn-purple { background-color: #8a2be2; }
    .btn-submit { background-color: #2196F3; width: 100%; padding: 12px; font-size: 1rem; margin-top: 10px; }
    
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background-color: #2a2a2a;
      color: white;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    
    /* Custom Checkbox Group (Multi Select Problem) */
    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checkbox-item input {
      accent-color: #8a2be2;
      width: 16px;
      height: 16px;
    }
    #reader {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }
    .note {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Inspection & Sign Off Form</h2>

  <!-- VIN Section -->
  <div class="form-group">
    <label>VIN NO *</label>
    <div class="btn-group">
      <button type="button" class="btn btn-green" onclick="startScanner()">📷 Live Scan Kamera</button>
      <button type="button" class="btn btn-purple" onclick="document.getElementById('qr-input-file').click()">📸 Foto Barcode / Galeri</button>
    </div>
    <input type="file" id="qr-input-file" accept="image/*" style="display:none">
    <div id="reader"></div>
    <input type="text" id="vinInput" placeholder="Hasil Scan VIN akan muncul di sini" required>
    <div class="note">*Gunakan "Foto Barcode" jika live kamera sulit fokus.</div>
  </div>

  <!-- Car Model -->
  <div class="form-group">
    <label>CAR MODEL *</label>
    <input type="text" id="carModel" placeholder="Masukkan Car Model">
  </div>

  <!-- Colour -->
  <div class="form-group">
    <label>COLOUR *</label>
    <input type="text" id="colour" placeholder="Masukkan Warna">
  </div>

  <!-- Problem (Multi Select Checkbox) -->
  <div class="form-group">
    <label>PROBLEM * (Pilih satu atau lebih)</label>
    <div class="checkbox-group">
      <label class="checkbox-item"><input type="checkbox" name="problem" value="Electrical"> Electrical</label>
      <label class="checkbox-item"><input type="checkbox" name="problem" value="Dent Issue"> Dent Issue</label>
      <label class="checkbox-item"><input type="checkbox" name="problem" value="Repair"> Repair</label>
      <label class="checkbox-item"><input type="checkbox" name="problem" value="Cripple"> Cripple</label>
    </div>
  </div>

  <!-- Problem Description -->
  <div class="form-group">
    <label>PROBLEM DESCRIPTION</label>
    <textarea id="problemDescription" rows="3" placeholder="Tuliskan deskripsi masalah secara manual..."></textarea>
  </div>

  <button type="button" class="btn btn-submit" id="submitBtn" onclick="submitForm()">Kirim ke Google Sheet</button>
</div>

<script>
  // GANTI SCRIPT_URL DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLK23qpH6PdS7LkRZx9H73I5K0oVPi-4jWaw4ZVE940npe21bRTGMJI6Inm45nH11uow/exec"; 

  let html5QrCode = new Html5Qrcode("reader");

  // Handler Scan dari Kamera Live
  function startScanner() {
    document.getElementById("reader").style.display = "block";
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        onVinScanned(decodedText);
        html5QrCode.stop();
        document.getElementById("reader").style.display = "none";
      },
      (errorMessage) => { /* ignore errors */ }
    ).catch(err => alert("Gagal membuka kamera: " + err));
  }

  // Handler Upload Foto Barcode dari Galeri
  document.getElementById('qr-input-file').addEventListener('change', e => {
    if (e.target.files.length === 0) return;
    const imageFile = e.target.files[0];
    html5QrCode.scanFile(imageFile, true)
      .then(decodedText => {
        onVinScanned(decodedText);
      })
      .catch(err => {
        alert("Barcode tidak terdeteksi dari gambar. Pastikan gambar jelas.");
      });
  });

  // Jalankan ketika VIN berhasil discan
  function onVinScanned(vin) {
    document.getElementById("vinInput").value = vin;
    // Panggilan opsional jika ingin melakukan auto-lookup ke database Sheet Master
  }

  // Submit Data Ke Google Sheets
  function submitForm() {
    const vin = document.getElementById("vinInput").value;
    const carModel = document.getElementById("carModel").value;
    const colour = document.getElementById("colour").value;
    const problemDescription = document.getElementById("problemDescription").value;

    // Ambil nilai problem yang dicentang
    const selectedProblems = [];
    document.querySelectorAll('input[name="problem"]:checked').forEach((checkbox) => {
      selectedProblems.push(checkbox.value);
    });

    if (!vin) {
      alert("Silakan isi/scan Nomor VIN terlebih dahulu!");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.innerText = "Mengirim...";
    btn.disabled = true;

    const payload = {
      vin: vin,
      carModel: carModel,
      colour: colour,
      problem: selectedProblems,
      problemDescription: problemDescription
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(response => {
      alert("Data berhasil tersimpan ke Google Sheet!");
      // Reset Form
      document.getElementById("vinInput").value = "";
      document.getElementById("carModel").value = "";
      document.getElementById("colour").value = "";
      document.getElementById("problemDescription").value = "";
      document.querySelectorAll('input[name="problem"]').forEach(cb => cb.checked = false);
    })
    .catch(error => {
      alert("Gagal mengirim data. Pastikan URL Script benar.");
      console.error(error);
    })
    .finally(() => {
      btn.innerText = "Kirim ke Google Sheet";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
