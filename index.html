<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inspection & Sign Off Form</title>
  <!-- Library Scan Barcode Terbaru (Optimized untuk WeCom & 1D Barcodes) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --accent-color: #38bdf8;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .form-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      height: fit-content;
    }

    .form-header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .form-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
    }

    .btn-purple {
      background: linear-gradient(135deg, #7e22ce, #a855f7);
      color: #ffffff;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 14px;
      font-size: 1rem;
      border-radius: 10px;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    /* Modern Scrollable Multi-Select Box */
    .scroll-select-box {
      max-height: 140px;
      overflow-y: auto;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Custom Scrollbar */
    .scroll-select-box::-webkit-scrollbar {
      width: 6px;
    }
    .scroll-select-box::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }

    .scroll-option {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .scroll-option:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .scroll-option input[type="checkbox"] {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .scroll-option span {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
      border: 2px solid var(--accent-color);
    }

    .hint-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="form-container">
  <div class="form-header">
    <h2>Inspection & Sign Off Form</h2>
  </div>

  <!-- VIN Section -->
  <div class="form-group">
    <label>VIN NO *</label>
    <div class="btn-grid">
      <button type="button" class="btn btn-cyan" onclick="startScanner()">📷 Live Scan</button>
      <button type="button" class="btn btn-purple" onclick="document.getElementById('file-input').click()">📁 Unggah Gambar</button>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none">
    
    <div id="reader"></div>

    <input type="text" id="vinInput" placeholder="Hasil Scan VIN akan terisi di sini..." required>
    <div class="hint-text">*Gunakan 'Unggah Gambar' jika kamera WeCom sulit fokus pada barcode.</div>
  </div>

  <!-- Car Model -->
  <div class="form-group">
    <label>CAR MODEL</label>
    <input type="text" id="carModel" placeholder="Masukkan Car Model">
  </div>

  <!-- Colour -->
  <div class="form-group">
    <label>COLOUR</label>
    <input type="text" id="colour" placeholder="Masukkan Warna Vehicle">
  </div>

  <!-- Multi-Select Problem (Scrollable Box) -->
  <div class="form-group">
    <label>PROBLEM * (Multi-Select Scroll)</label>
    <div class="scroll-select-box">
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Electrical">
        <span>Electrical</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Dent Issue">
        <span>Dent Issue</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Repair">
        <span>Repair</span>
      </label>
      <label class="scroll-option">
        <input type="checkbox" name="problem" value="Cripple">
        <span>Cripple</span>
      </label>
    </div>
  </div>

  <!-- Problem Description -->
  <div class="form-group">
    <label>PROBLEM DESCRIPTION</label>
    <textarea id="problemDescription" rows="3" placeholder="Tuliskan detail deskripsi masalah di sini..."></textarea>
  </div>

  <button type="button" class="btn btn-submit" id="submitBtn" onclick="submitForm()">Kirim Data</button>
</div>

<script>
  // SILAKAN MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLK23qpH6PdS7LkRZx9H73I5K0oVPi-4jWaw4ZVE940npe21bRTGMJI6Inm45nH11uow/exec";

  let html5Scanner = null;

  // Konfigurasi Scan Engine khusus Barcode 1D (Optimized WeCom Barcodes)
  const barcodeConfig = {
    fps: 15,
    qrbox: { width: 280, height: 120 },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.UPC_A
    ]
  };

  // Live Scan Kamera
  function startScanner() {
    const readerElem = document.getElementById("reader");
    readerElem.style.display = "block";

    if (!html5Scanner) {
      html5Scanner = new Html5Qrcode("reader");
    }

    html5Scanner.start(
      { facingMode: "environment" },
      barcodeConfig,
      (decodedText) => {
        document.getElementById("vinInput").value = decodedText;
        stopScanner();
      },
      (errorMessage) => { /* scanning status */ }
    ).catch(err => {
      alert("Akses kamera gagal: " + err);
      readerElem.style.display = "none";
    });
  }

  function stopScanner() {
    if (html5Scanner) {
      html5Scanner.stop().then(() => {
        document.getElementById("reader").style.display = "none";
      }).catch(err => console.error(err));
    }
  }

  // Scan dari File Gambar / Galeri WeCom
  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files.length === 0) return;
    const file = e.target.files[0];

    if (!html5Scanner) {
      html5Scanner = new Html5Qrcode("reader");
    }

    html5Scanner.scanFileV2(file, true)
      .then(result => {
        document.getElementById("vinInput").value = result.decodedText;
      })
      .catch(err => {
        alert("Barcode tidak terbaca dari foto ini. Pastikan gambar barcode cukup jelas/terang.");
      });
  });

  // Kirim Data ke Google Sheet
  function submitForm() {
    const vin = document.getElementById("vinInput").value;
    const carModel = document.getElementById("carModel").value;
    const colour = document.getElementById("colour").value;
    const problemDescription = document.getElementById("problemDescription").value;

    const selectedProblems = [];
    document.querySelectorAll('input[name="problem"]:checked').forEach((cb) => {
      selectedProblems.push(cb.value);
    });

    if (!vin) {
      alert("Harap scan atau isi Nomor VIN terlebih dahulu!");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.innerText = "Mengirim...";
    btn.disabled = true;

    const payload = {
      vin: vin,
      carModel: carModel,
      colour: colour,
      problem: selectedProblems,
      problemDescription: problemDescription
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(response => {
      alert("Data berhasil tersimpan di Google Sheet!");
      // Reset Form
      document.getElementById("vinInput").value = "";
      document.getElementById("carModel").value = "";
      document.getElementById("colour").value = "";
      document.getElementById("problemDescription").value = "";
      document.querySelectorAll('input[name="problem"]').forEach(cb => cb.checked = false);
    })
    .catch(error => {
      alert("Gagal mengirim data. Cek koneksi atau URL Apps Script Anda.");
      console.error(error);
    })
    .finally(() => {
      btn.innerText = "Kirim Data";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
