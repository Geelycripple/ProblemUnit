<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Problem Geely 吉利车辆问题</title>
  <!-- HTML5-QRCode Library untuk Scanner Kamera -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; color: #2d3748; }
    
    .card { background: #ffffff; border-radius: 16px; padding: 20px; max-width: 480px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }
    h2 { text-align: center; font-size: 20px; margin-top: 0; margin-bottom: 20px; color: #1a202c; }
    
    .form-group { margin-bottom: 16px; }
    label { font-size: 13px; font-weight: 700; color: #4a5568; display: block; margin-bottom: 6px; }
    
    input[type="text"], select, textarea { 
      width: 100%; padding: 12px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 10px; background-color: #ffffff; color: #2d3748; outline: none; transition: all 0.2s;
    }
    input[readonly] { background-color: #edf2f7; color: #4a5568; cursor: not-allowed; }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15); }

    .row-2 { display: flex; gap: 10px; }
    .row-2 > div { flex: 1; }

    /* Button Scan */
    .btn-scan { 
      width: 100%; padding: 12px; background: #00a86b; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; transition: background 0.2s;
    }
    .btn-scan:hover { background: #008f5a; }

    /* Scrollable Multi Select Box */
    .checkbox-scroll-box {
      max-height: 180px; overflow-y: auto; border: 1px solid #cbd5e0; border-radius: 10px; padding: 8px; background: #faf5ff; display: flex; flex-direction: column; gap: 6px;
    }
    .checkbox-scroll-box::-webkit-scrollbar { width: 6px; }
    .checkbox-scroll-box::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 4px; }
    
    .checkbox-item { 
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: #ffffff; border: 1px solid #e2e8f0; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s;
    }
    .checkbox-item:hover { background: #f7fafc; }
    .checkbox-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2b6cb0; cursor: pointer; }
    .checkbox-item.done-item { border-color: #c6f6d5; background: #f0fff4; color: #22543d; font-weight: 700; }

    /* Submit Button */
    .btn-submit { 
      width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: all 0.2s;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #a0aec0; cursor: not-allowed; box-shadow: none; }

    /* Modal Camera Scanner */
    .modal-scanner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
    .scanner-card { background: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 15px; text-align: center; }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; }
    .btn-close-scanner { margin-top: 10px; width: 100%; padding: 10px; background: #e53e3e; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

    /* Modern Success Modal Layer (Locked UI) */
    .success-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 10000; justify-content: center; align-items: center; padding: 20px;
    }
    .success-card {
      background: #ffffff; width: 100%; max-width: 380px; border-radius: 24px; padding: 35px 25px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: popupAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popupAnim { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .check-circle {
      width: 90px; height: 90px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;
    }
    .check-circle svg { width: 45px; height: 45px; stroke: #16a34a; }

    .submitted-vin { font-size: 18px; font-weight: 800; color: #15803d; margin-bottom: 4px; word-break: break-all; }
    .submitted-title { font-size: 18px; font-weight: 700; color: #16a34a; margin-bottom: 8px; }
    .submitted-chinese { font-size: 13px; color: #64748b; margin-bottom: 25px; font-weight: 500; }

    .btn-new-report {
      width: 100%; padding: 14px; background: #2563eb; color: #ffffff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); transition: background 0.2s;
    }
    .btn-new-report:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="card">
  <h2>Unit Problem Geely 吉利车辆问题</h2>
  
  <form id="problemForm">
    <!-- Date & Time -->
    <div class="row-2">
      <div class="form-group">
        <label>Date 日期*</label>
        <input type="text" id="dateInput" readonly>
      </div>
      <div class="form-group">
        <label>Time 时间*</label>
        <input type="text" id="timeInput" readonly>
      </div>
    </div>

    <!-- VIN & Scan Barcode -->
    <div class="form-group">
      <label>VIN NO 车架号*</label>
      <button type="button" class="btn-scan" id="openScanBtn">📷 Live Scan Barcode</button>
      <input type="text" id="vinInput" placeholder="Hasil Scan VIN akan muncul di sini..." readonly required>
    </div>

    <!-- Car Model & Colour -->
    <div class="form-group">
      <label>Car Model 车型</label>
      <input type="text" id="carModelInput" placeholder="Terisi otomatis dari MASTER DATA..." readonly>
    </div>
    <div class="form-group">
      <label>Colour 颜色</label>
      <input type="text" id="colourInput" placeholder="Terisi otomatis dari MASTER DATA..." readonly>
    </div>

    <!-- 1. Station -->
    <div class="form-group">
      <label>Station 工位*</label>
      <select id="stationSelect" required>
        <option value="">Pilih Station... / 请选择</option>
        <option value="IN TESTLINE">IN TESTLINE</option>
        <option value="INSPECTION">INSPECTION</option>
        <option value="AFTER INSPECTION">AFTER INSPECTION</option>
        <option value="SIGN OFF">SIGN OFF</option>
      </select>
    </div>

    <!-- 2. Problem Inspection (Multi Select Scrollable) -->
    <div class="form-group">
      <label>Problem Inspection 检验问题*</label>
      <div class="checkbox-scroll-box">
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Gap"> Gap</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Rash"> Rash</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Flush"> Flush</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Wavy"> Wavy</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Bending"> Bending</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Dent Issue"> Dent Issue</label>
        <label class="checkbox-item"><input type="checkbox" name="probInsp" value="Crater"> Crater</label>
        <label class="checkbox-item done-item"><input type="checkbox" name="probInsp" value="PROBLEM DONE"> ✅ PROBLEM DONE</label>
      </div>
    </div>

    <!-- 3. Problem Description Inspection -->
    <div class="form-group">
      <label>Problem Description Inspection 检验问题详细描述</label>
      <textarea id="descInspInput" rows="2" placeholder="Masukkan detail deskripsi..."></textarea>
    </div>

    <!-- 4. Problem After Inspection (Multi Select Scrollable) -->
    <div class="form-group">
      <label>Problem After Inspection 检验后问题*</label>
      <div class="checkbox-scroll-box">
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Noise"> Noise</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="ADAS"> ADAS</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Electrical"> Electrical</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Mechanichal"> Mechanichal</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Change Part"> Change Part</label>
        <label class="checkbox-item"><input type="checkbox" name="probAfter" value="Liquidity"> Liquidity</label>
        <label class="checkbox-item done-item"><input type="checkbox" name="probAfter" value="PROBLEM DONE"> ✅ PROBLEM DONE</label>
      </div>
    </div>

    <!-- 5. Problem Description After Inspection -->
    <div class="form-group">
      <label>Problem Description After Inspection 检验后问题详细描述</label>
      <textarea id="descAfterInput" rows="2" placeholder="Masukkan detail deskripsi..."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT / 提交</button>
  </form>
</div>

<!-- Modal Camera Scanner -->
<div class="modal-scanner" id="scannerModal">
  <div class="scanner-card">
    <h3 style="margin-top:0;">Scan Barcode VIN</h3>
    <div id="reader"></div>
    <button type="button" class="btn-close-scanner" id="closeScanBtn">Tutup Kamera</button>
  </div>
</div>

<!-- Success Popup Layer (Locked Overlay) -->
<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="submitted-vin" id="displayVin">MGEEH40FXTJ013701</div>
    <div class="submitted-title">berhasil submitted</div>
    <div class="submitted-chinese">提交成功！数据已更新到 Google Sheets</div>
    <button type="button" class="btn-new-report" id="newReportBtn">+ New Unit Report 新建报告</button>
  </div>
</div>

<script>
  // ** MASUKKAN URL APPS SCRIPT ANDA DI SINI **
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3vQ6MEcaSp0KmPp8po5JgXv0r_4N7qFtJXUDilNi2jrszBMLG3ZhuVyYlo1Y5PzVFRg/exec";

  let html5QrcodeScanner = null;

  // Realtime Date & Time
  function updateDateTime() {
    const now = new Date();
    document.getElementById('dateInput').value = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    document.getElementById('timeInput').value = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(updateDateTime, 1000);
  updateDateTime();

  // Fetch Auto-Fill Car Model & Colour dari MASTER DATA
  function fetchMasterData(vin) {
    document.getElementById('carModelInput').value = "Mencari di MASTER DATA...";
    document.getElementById('colourInput').value = "Mencari di MASTER DATA...";

    const cbName = 'jsonp_master_' + Math.round(100000 * Math.random());
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=searchVIN&vin=${encodeURIComponent(vin)}&callback=${cbName}&authuser=0`;

    window[cbName] = function(data) {
      delete window[cbName];
      if (document.body.contains(script)) document.body.removeChild(script);

      if (data.status === 'success') {
        document.getElementById('carModelInput').value = data.carModel || '-';
        document.getElementById('colourInput').value = data.colour || '-';
      } else {
        alert("⚠️ VIN (" + vin + ") Tidak ditemukan pada sheet MASTER DATA!");
        document.getElementById('carModelInput').value = "";
        document.getElementById('colourInput').value = "";
        document.getElementById('vinInput').value = "";
      }
    };

    script.onerror = function() {
      delete window[cbName];
      if (document.body.contains(script)) document.body.removeChild(script);
      alert("Gagal terhubung ke Google Sheets untuk mengambil Master Data.");
      document.getElementById('carModelInput').value = "";
      document.getElementById('colourInput').value = "";
    };

    document.body.appendChild(script);
  }

  // Camera Barcode Scanner Controls
  document.getElementById('openScanBtn').addEventListener('click', function() {
    document.getElementById('scannerModal').style.display = 'flex';
    
    if (!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5Qrcode("reader");
    }

    const config = { fps: 15, qrbox: { width: 280, height: 150 } };
    
    html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
    .catch(err => {
      alert("Gagal membuka kamera. Pastikan izin kamera telah diberikan!");
      document.getElementById('scannerModal').style.display = 'none';
    });
  });

  function onScanSuccess(decodedText) {
    const vinScanned = decodedText.trim();
    document.getElementById('vinInput').value = vinScanned;
    
    // Hentikan scanner kamera
    html5QrcodeScanner.stop().then(() => {
      document.getElementById('scannerModal').style.display = 'none';
      fetchMasterData(vinScanned);
    }).catch(err => {
      document.getElementById('scannerModal').style.display = 'none';
      fetchMasterData(vinScanned);
    });
  }

  document.getElementById('closeScanBtn').addEventListener('click', function() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        document.getElementById('scannerModal').style.display = 'none';
      }).catch(() => {
        document.getElementById('scannerModal').style.display = 'none';
      });
    } else {
      document.getElementById('scannerModal').style.display = 'none';
    }
  });

  // Submit Form Process
  document.getElementById('problemForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const vin = document.getElementById('vinInput').value;
    if (!vin) {
      alert("Silakan scan VIN terlebih dahulu!");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Mengirim Data...";

    const probInsp = Array.from(document.querySelectorAll('input[name="probInsp"]:checked')).map(c => c.value).join(', ');
    const probAfter = Array.from(document.querySelectorAll('input[name="probAfter"]:checked')).map(c => c.value).join(', ');

    const payload = {
      action: 'saveData',
      timeInput: document.getElementById('dateInput').value + " " + document.getElementById('timeInput').value,
      vin: vin,
      carModel: document.getElementById('carModelInput').value,
      colour: document.getElementById('colourInput').value,
      station: document.getElementById('stationSelect').value,
      problemInspection: probInsp,
      descInspection: document.getElementById('descInspInput').value,
      problemAfter: probAfter,
      descAfter: document.getElementById('descAfterInput').value
    };

    const cbName = 'jsonp_save_' + Math.round(100000 * Math.random());
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=saveData&data=${encodeURIComponent(JSON.stringify(payload))}&callback=${cbName}&authuser=0`;

    window[cbName] = function(res) {
      delete window[cbName];
      if (document.body.contains(script)) document.body.removeChild(script);
      
      submitBtn.disabled = false;
      submitBtn.innerText = "SUBMIT / 提交";

      if (res.status === 'success') {
        // Tampilkan Custom Pop Up Overlay
        document.getElementById('displayVin').innerText = vin;
        document.getElementById('successOverlay').style.display = 'flex';
      } else {
        alert("Gagal menyimpan data: " + res.message);
      }
    };

    script.onerror = function() {
      delete window[cbName];
      if (document.body.contains(script)) document.body.removeChild(script);
      submitBtn.disabled = false;
      submitBtn.innerText = "SUBMIT / 提交";
      alert("Terjadi kesalahan koneksi saat mengirim data.");
    };

    document.body.appendChild(script);
  });

  // + New Unit Report Button (Reset Form & Hide Overlay)
  document.getElementById('newReportBtn').addEventListener('click', function() {
    document.getElementById('problemForm').reset();
    document.getElementById('successOverlay').style.display = 'none';
    updateDateTime();
  });
</script>

</body>
</html>
